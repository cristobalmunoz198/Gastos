<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#0b3d2e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<title>Gastos</title>
</head>
<body>

<!-- Conectar (solo la primera vez) -->
<section id="vConectar" class="hidden">
  <header><h1>Conectar</h1></header>
  <p class="ayuda">Pega la URL de tu script (termina en <b>/exec</b>) y tu clave. Solo tienes que hacerlo una vez.</p>
  <div class="card">
    <label class="campo"><span>URL del script</span><input id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="campo"><span>Clave</span><input id="cClave" type="password" placeholder="Tu clave" autocapitalize="off" autocorrect="off"></label>
  </div>
  <button class="btn-pri" id="cConectar">Conectar</button>
</section>

<div id="vApp" class="hidden">

  <!-- Inicio -->
  <section id="s-inicio" class="pantalla">
    <header>
      <h1 id="iTitulo">Inicio</h1>
      <div class="sel">
        <select id="iMes" aria-label="Mes"></select>
        <select id="iAnio" aria-label="Año"></select>
      </div>
    </header>
    <div id="iCargando" class="cargando">Cargando…</div>
    <div id="iPanel" class="hidden">
      <div class="card anillo-card">
        <svg viewBox="0 0 160 160" class="anillo" role="img" aria-label="Disponible del mes">
          <circle cx="80" cy="80" r="66" class="anillo-fondo"/>
          <circle cx="80" cy="80" r="66" class="anillo-arco" id="anilloArco" transform="rotate(-90 80 80)"/>
        </svg>
        <div class="anillo-texto">
          <div class="mut peq">Disponible</div>
          <div id="anilloMonto" class="anillo-monto">$0</div>
          <div id="anilloPct" class="mut peq"></div>
        </div>
        <div id="sinPres" class="aviso hidden">Sin presupuesto este mes · <a href="#" id="sinPresIr">armarlo</a></div>
        <div id="inicioMeta" class="meta"></div>
      </div>
      <div id="sobres" class="sobres"></div>
      <div id="sobreDetalle" class="card hidden"></div>
      <div id="tendencias" class="card hidden"></div>
      <div id="metas" class="card"></div>
    </div>
  </section>

  <!-- Movimientos -->
  <section id="s-movimientos" class="pantalla hidden">
    <header><h1>Movimientos</h1><span id="mMesTxt" class="pill"></span></header>
    <input id="mBuscar" class="buscar" placeholder="Buscar categoría o nota" autocomplete="off">
    <div id="mLista"></div>
  </section>

  <!-- Agregar -->
  <section id="s-agregar" class="pantalla hidden">
    <header><h1>Agregar</h1></header>
    <div class="card">
      <div class="chips" id="aTipos">
        <button class="chip chip-tipo on" data-tipo="gasto">Gasto</button>
        <button class="chip chip-tipo" data-tipo="ingreso">Ingreso</button>
        <button class="chip chip-tipo" data-tipo="ahorro">Ahorro</button>
      </div>
      <input id="aMonto" class="monto" inputmode="numeric" placeholder="$0" autocomplete="off">
      <div class="rapidos" id="aRapidos"></div>
    </div>
    <div class="card"><p class="lbl">Sección</p><div class="chips scroll" id="aSecciones"></div></div>
    <div class="card"><p class="lbl">Categoría</p><div class="chips" id="aCategorias"></div></div>
    <div class="card">
      <label class="fila"><span class="lbl0">Fecha</span><input type="date" id="aFecha"></label>
      <label class="fila"><span class="lbl0">Nota</span><input id="aNota" placeholder="Opcional" autocomplete="off"></label>
    </div>
    <p id="aResumen" class="resumen"></p>
    <button class="btn-pri" id="aGuardar" disabled>Guardar</button>
  </section>

  <!-- Historial -->
  <section id="s-historial" class="pantalla hidden">
    <header><h1>Historial</h1><select id="hAnio" aria-label="Año"></select></header>
    <div class="card"><svg id="hGrafico" viewBox="0 0 320 120" class="grafico" role="img" aria-label="Gastado por mes"></svg></div>
    <div class="card" id="hLista"></div>
  </section>

  <!-- Ajustes -->
  <section id="s-ajustes" class="pantalla hidden">
    <header><h1 id="ajTitulo">Ajustes</h1><button class="icono hidden" id="ajVolver" aria-label="Volver">‹</button></header>
    <div id="ajMenu">
      <button class="link" data-aj="presupuesto">Presupuesto del mes <span>›</span></button>
      <button class="link" data-aj="metas">Metas de ahorro <span>›</span></button>
      <button class="link" data-aj="categorias">Categorías <span>›</span></button>
      <button class="link" data-aj="conexion">Conexión <span>›</span></button>
    </div>
    <div id="aj-presupuesto" class="hidden"></div>
    <div id="aj-metas" class="hidden"></div>
    <div id="aj-categorias" class="hidden"></div>
    <div id="aj-conexion" class="hidden"></div>
  </section>

  <!-- Hoja inferior (editar) -->
  <div id="hoja" class="hoja hidden"><div class="hoja-caja" id="hojaCaja"></div></div>

  <nav class="nav">
    <button data-s="inicio" class="on"><i>◉</i>Inicio</button>
    <button data-s="movimientos"><i>☰</i>Movim.</button>
    <button data-s="agregar" class="nav-mas"><i>＋</i>Agregar</button>
    <button data-s="historial"><i>▥</i>Historial</button>
    <button data-s="ajustes"><i>⚙︎</i>Ajustes</button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="sync hidden" id="sync"></div>
<script src="calculos.js"></script>
<script src="app.js"></script>
</body>
</html>
